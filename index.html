<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script src="site.js"></script>
<script>
loadContent()
  .then(c => renderPublic(c, $("#app")))
  .catch(() => $("#app").innerHTML = `<div class="loading">Couldn't load content.json.</div>`);

// Presentation-style paging with the keyboard
document.addEventListener("keydown", e => {
  if (!["ArrowDown","ArrowUp","PageDown","PageUp"].includes(e.key)) return;
  const els = [...document.querySelectorAll(".hero, .slide")], y = scrollY + 10;
  let i = els.findIndex((el,k) => el.offsetTop <= y && (els[k+1]?.offsetTop ?? Infinity) > y);
  const next = (e.key==="ArrowDown"||e.key==="PageDown") ? Math.max(i,0)+1 : i-1;
  if (els[next]){ e.preventDefault(); els[next].scrollIntoView(); }
});
</script>
</body>
</html>
